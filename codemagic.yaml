# Codemagic CI/CD for the suite — Run and Lift
# (see apps/mgk_run/docs/decisions/0020-codemagic-is-the-build-path.md).
#
# Four manual-trigger workflows plus `checks`: Run → TestFlight, Lift →
# TestFlight, Run → Play, Lift → Play. The iOS pair runs on macOS cloud
# machines, so shipping never depends on having a Mac to hand — which matters
# here, because both apps are developed on Windows against an Android emulator
# and neither has ever been built locally for its actual target. The Android
# pair runs on Linux, because nothing about them needs Xcode and the macOS
# instance costs several times more per minute.
#
# **RUN SHIPS TO PLAY, as of 2026-09-10.** `run-android-release` builds a signed
# AAB alongside the APK and carries a `publishing:` block — commented until the
# first bundle has been uploaded to the listing by hand, which the Play
# Developer API requires before it will accept an API publish. See
# `apps/mgk_run/docs/play-setup.md`.
#
# THIS PARAGRAPH HAS NOW BEEN WRONG TWICE, IN THE SAME PLACE, ABOUT THE SAME
# WORKFLOW. It read "Run has no Android workflow" until 2026-09-01 while
# `run-android-release` sat a few hundred lines below it. It was corrected to
# "Run has no Android RELEASE, deliberately (ADR-0001)" — a verification
# harness for design work on Windows, and a store pipeline would imply
# otherwise — and that survived nine days before Run acquired a Play listing,
# a keystore and a publishing block.
#
# Worth keeping rather than tidying away, because the failure has a shape: this
# header states a POLICY about the workflows, the workflows below state the
# FACTS, and nothing checks the two against each other. A reader trusts the
# header because it is first. If the third correction is ever needed, the
# honest fix is probably to stop asserting policy up here at all and let each
# workflow speak for itself.
#
# ───────────────────────────────────────────────────────────────────────────
# ONE-TIME SETUP IN THE CODEMAGIC UI (referenced by name below):
#
#  1. Connect this repo to Codemagic.
#
#  0. **This file must sit at the REPOSITORY ROOT.** Codemagic reads
#     `codemagic.yaml` from the root of the clone and nowhere else, so while it
#     lived at `apps/mgk_run/codemagic.yaml` the build could not start at all —
#     it would report no configuration found. This is a monorepo, so the app it
#     builds is named by `working_directory` below rather than by where the
#     file sits.
#  2. App Store Connect API key → Team settings ▸ Integrations ▸ **Developer
#     Portal** ▸ Manage keys. Codemagic folded the App Store Connect key into
#     that integration; there is no separate "App Store Connect" row. One key
#     with App Manager covers signing AND the TestFlight upload for both
#     MGKFitness apps: `mgkfitness_asc` (key 4HNLTYJL55, 2026-09-30), which the
#     workflows below reference. **Not `frunt_asc`**, although an App Store
#     Connect key is issued to the team and would work: nothing MGKFitness
#     ships may depend on anything of Frunt's, so a key rotated or revoked for
#     Frunt can never stop Run or Lift shipping.
#  3a. Environment group `mgk_fitness_supabase` (Application settings ▸
#     Environment variables, mark Secure) with:
#       SUPABASE_URL              the shared MGKCodes fitness project (ADR-0008)
#       SUPABASE_PUBLISHABLE_KEY  the publishable (anon) key, NOT the service key
#
#     **Shared by every workflow in this file**, because ADR-0008 says there is
#     one Supabase project for the suite. Both apps read exactly these two
#     values, so a copy per app would mean a key rotation that silently half
#     lands — one product fixed, the other still pointed at a dead key, and no
#     build failure to say so. `AppConfig` treats missing values as "no server"
#     rather than as an error, so the symptom would be an app that ships and
#     cannot sign anybody in.
#
#  3b. Environment group `mgk_fitness_run_env`, same screen, for what only Run
#     has:
#       MAP_TILE_URL_TEMPLATE     optional. The tile server the privacy policy
#                                 names. Without it the run map draws the route
#                                 on charcoal with no basemap — which is what
#                                 the first TestFlight build did.
#       MAP_ATTRIBUTION           required WHENEVER MAP_TILE_URL_TEMPLATE is
#                                 set, and unused otherwise. Every provider
#                                 worth using requires visible credit, so a
#                                 basemap with no attribution is a terms
#                                 breach rather than a cosmetic omission. The
#                                 build refuses the pair half-set.
#     Nothing else belongs in either group. The OpenRouter key lives in Supabase
#     secrets and never reaches the client (ADR-0007); a provider key here would
#     be a provider key in the app bundle.
#  5. **An App Store distribution provisioning profile for
#     `com.mgkcodes.fitness.run`.** developer.apple.com ▸ Certificates,
#     Identifiers & Profiles ▸ Profiles ▸ + ▸ Distribution ▸ App Store Connect,
#     pick the App ID and the existing Apple Distribution certificate.
#
#     Create it AFTER the App ID's capabilities are set — a profile is a
#     snapshot of them, so ticking HealthKit later means regenerating this.
#     Nothing to download; Codemagic fetches it through the API key.
#
#  4. App Store Connect → new app, bundle id `com.mgkcodes.fitness.run`.
#     **Not the product name, and deliberately so.** A bundle id is permanent
#     once the App Store Connect record exists, and the name is not settled;
#     `com.mgkcodes.runio` would have welded a working title to the app
#     forever. This one says what the app *is* — MGKCodes, the fitness suite,
#     the running one — and survives any rename, because the name customers
#     see is CFBundleDisplayName and can change whenever you like. Required
#     before any TestFlight upload will be accepted.
#
#  6. **Lift only — the signing pair, uploaded by hand.** Everything above is
#     Run's. Lift does not fetch its profile at build time (see the note below
#     the setup block), so both halves have to sit in Codemagic ▸ Teams ▸ Code
#     signing identities:
#
#       iOS certificates       `mgkfitness_distribution`, which Run's
#                              profile uses too (see below)
#       Provisioning profiles  the .mobileprovision, reference name
#                              `Lift MGKFitness App Store`
#
#     **The reference name is an identifier, not a label.** It is what
#     `lift-ios-release` looks the identity up by, and nothing in the Codemagic
#     UI says so. A mismatch fails the build before a machine starts, listing
#     the names it does have — which is at least a readable failure.
#
#     **Both apps sign with MGKFitness's own certificate**,
#     `mgkfitness_distribution` (Apple Distribution, expiring 2027-09-30).
#     Codemagic generated it on 2026-09-30 from `mgkfitness_asc` and holds its
#     private key. Before that, Lift signed with EAS's legacy certificate
#     (March 2027, the Codemagic entry `Lift MGKFitness Distribution`, now
#     unused) and Run with the certificate Codemagic calls
#     `frunt_distribution`, which is Frunt's and stays Frunt's alone.
#
#     **Generate the profile in the Apple portal**, and pick the certificate
#     by its expiry: Profiles ▸ `Lift MGKFitness App Store` ▸ Edit ▸ the
#     certificate **expiring 2027-09-30** ▸ Save ▸ Download, then upload it
#     here under the same reference name. Apple offers every distribution
#     certificate in the team, and on regenerating a profile it chose
#     Frunt's; a profile whose certificate Codemagic has no key for, or that
#     belongs to another product, is the failure this setup exists to avoid.
#     Regenerate it whenever the App ID's capabilities change: a profile is a
#     snapshot of them (Sign in with Apple was added 2026-09-30).
#
#     Verify the pair before uploading, offline and in seconds: the profile is
#     a CMS-wrapped plist (`openssl smime -inform der -verify -noverify`), and
#     its `DeveloperCertificates[0]` must be byte-identical to the certificate
#     inside the .p12. If they differ, the build signs and then fails at the
#     end. A profile is also a snapshot of the App ID's capabilities, so
#     regenerate it after changing them. Lift's first entitlements file
#     (Sign in with Apple, 2026-09-30) is why its profile was regenerated.
# ───────────────────────────────────────────────────────────────────────────

# One workflow per app, all in this one file, because Codemagic reads exactly
# one codemagic.yaml — the repository root's — and this repo builds more than
# one product. Lift is a sibling of the block below, not a second file:
# its own `working_directory: apps/mgk_lift`, its own bundle identifier, its own
# environment group. Everything above this line — the key, the signing setup,
# the macOS instance — is shared.
#
# **Lift's identifier does NOT follow the pattern above.** It is
# `com.mgkcodes.liftio`, inherited from the app it replaces on an existing App
# Store record, so do not copy Run's `com.mgkcodes.fitness.*` shape across. See
# apps/mgk_lift/docs/decisions/0001-liftio-is-replaced-not-relaunched.md.
#
# An earlier version of this comment claimed the inherited App ID meant the
# provisioning profile came with it, so Run's first-build signing failure could
# not repeat. **It repeated.** Lift's first build (2026-08-18, commit 7d758a2)
# died with the identical message — "No matching profiles found for bundle
# identifier com.mgkcodes.liftio and distribution type app_store". An App Store
# record, an App ID and a distribution certificate are three things, and none of
# them is a provisioning profile. EAS managed Liftio's signing and left nothing
# behind that this pipeline can fetch.
#
# **Resolved by not fetching at all.** Three more identical failures on
# 2026-08-21 — after the profile had been created by hand, and with the bundle
# id, team and certificate each ruled out — moved Lift to manual signing: the
# certificate and profile are uploaded to Codemagic once and the fetch step
# stops existing. Run still fetches, because for Run it has always worked.
#
# Worth adding when there are two: a `triggering.when.changeset.includes` on
# each, so a commit that only touches Lift does not spend twenty minutes
# building Run. While both are manual-trigger only, it costs nothing.
workflows:
  # ───────────────────────────────────────────────────────────────────────────
  # The only workflow here that is not a build.
  #
  # Until this existed, NOTHING ran automatically: the three workflows below all
  # produce store artefacts, and the 188 Deno tests, 3 pgTAP suites and 292
  # Flutter tests were run by hand or not at all. A suite that only runs when
  # somebody remembers is a suite that is green because nobody looked.
  #
  # Linux, because none of it needs Xcode and the macOS instance costs several
  # times more per minute. The whole thing is minutes, mostly spent installing
  # tools rather than running tests — `deno test` alone is 188 tests in one
  # second.
  #
  # **Each layer is its own step on purpose.** One combined script would report
  # "tests failed" and leave you to find out which of four things broke; named
  # steps put the answer in the build list.
  # ───────────────────────────────────────────────────────────────────────────
  checks:
    name: Checks — Deno, pgTAP, Flutter
    # macOS, not Linux — see the long note in `run-android-release`.
    #
    # **THIS WORKFLOW HAD NEVER RUN.** It declared `linux_x2`, which is not
    # available on this account's plan, so every push since it was written died
    # before a machine started. The comment below says a check you have to
    # trigger is a check you skip; this one could not be triggered at all, and
    # nothing said so loudly enough to notice.
    #
    # Worth stating plainly because it explains a pattern: every defect this
    # release has found — four arguments nobody passed, a build number the docs
    # invented, a keystore reference pointing at nothing — was caught by
    # reading, by a device, or by somebody saying so. None was caught by CI. The
    # obvious reading was that the suite does not cover those cases, and the
    # actual reason is that the suite was never running.
    instance_type: mac_mini_m2
    max_build_duration: 20

    # Unlike the release workflows, this one is meant to run without being
    # asked. A check you have to trigger is a check you skip on the day you are
    # in a hurry, which is the day you needed it.
    triggering:
      events:
        - push
        - pull_request
      branch_patterns:
        - pattern: '*'
          include: true

    cache:
      cache_paths:
        - $HOME/.pub-cache
        - $HOME/.cache/deno

    environment:
      flutter: stable

    scripts:
      - name: Deno — coach function
        # No permission flags. The tests fake `fetch` rather than reaching the
        # network, which is why they are a second rather than a minute, and why
        # a red here is always the code rather than the weather.
        working_directory: supabase/functions/coach
        script: deno test

      - name: Deno — RevenueCat webhook
        # The only writer of core.entitlements, and therefore the only thing
        # standing between a purchase and a coach (ADR-0030). Its mapping is
        # pure for exactly this reason: a wrong status here either hands
        # somebody a subscription they did not buy or takes one they did, and
        # neither should need a store to catch.
        working_directory: supabase/functions/revenuecat
        script: deno test

      - name: Deno — eval rules
        # The arithmetic half of the coach evals. Separate from the graded run,
        # which costs money, needs an account and is deliberately not a gate —
        # see supabase/evals/README.md. These are pure functions and belong
        # here with everything else that cannot be flaky.
        working_directory: supabase/evals
        script: deno test --allow-net=jsr.io

      - name: pgTAP — schema contracts
        # `supabase test db` spins Postgres in Docker, so this is the slowest
        # step by a distance. It earns it: coach_contract.sql asserts invariants
        # against the catalog rather than against migration text, which is the
        # only version of that check that survives a migration being edited.
        script: |
          curl -fsSL https://github.com/supabase/cli/releases/latest/download/supabase_linux_amd64.tar.gz             | tar -xz -C /tmp
          sudo mv /tmp/supabase /usr/local/bin/supabase
          supabase --version
          supabase test db

      - name: Flutter — packages and generated code
        # **Not optional.** `*.g.dart` is gitignored, so a fresh clone has no
        # drift sources and mgk_lift does not compile without this — the same
        # reason both release workflows carry the identical step. Analysing
        # before it runs reports a few hundred phantom errors about undefined
        # getters, which is a very convincing way to waste an afternoon.
        script: |
          flutter pub get
          cd apps/mgk_lift && dart run build_runner build --delete-conflicting-outputs

      - name: Flutter — analyze
        # mgk_run is excluded deliberately. Its drift sources would need
        # generating too, which doubles this step's runtime to analyse code
        # this workflow does not test and whose own release workflow already
        # covers it.
        script: flutter analyze apps/mgk_lift packages/mgk_ui

      - name: Flutter — mgk_ui
        working_directory: packages/mgk_ui
        script: flutter test

      - name: Flutter — mgk_lift
        working_directory: apps/mgk_lift
        script: flutter test

  run-ios-release:
    name: Run — iOS TestFlight
    instance_type: mac_mini_m2
    # A cap on waste, not a target. A build that finishes in twenty minutes is
    # billed twenty; this only bites when something hangs, and 60 meant an hour
    # of a metered plan spent on a wedged process. A cold Flutter iOS build with
    # a CocoaPods install lands well inside this.
    max_build_duration: 45

    # The single biggest saving on a metered plan. Without it every run
    # re-downloads the whole pub cache and rebuilds every pod, which is most of
    # a cold build's minutes and none of its value.
    #
    # Not cached: build/ and .dart_tool/, deliberately. Stale generated output
    # is how a green build ships yesterday's code, and drift's sources are
    # generated fresh each run for exactly that reason.
    cache:
      cache_paths:
        - $HOME/.pub-cache
        - $CM_BUILD_DIR/apps/mgk_run/ios/Pods
    # Every script below runs from the app, not the repo root. Without this the
    # first `flutter pub get` would run against the workspace root and build the
    # wrong thing — or nothing.
    working_directory: apps/mgk_run
    integrations:
      # MGKFitness's own key (setup note 2). Until 2026-09-30 this was
      # `frunt_asc`, on the reasoning that a key is issued to the team rather
      # than an app. It is, and that is not the point: Run must not stop
      # shipping because of something done to Frunt.
      app_store_connect: mgkfitness_asc
    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.mgkcodes.fitness.run
      groups:
        # The Supabase pair is shared with Lift — one project (ADR-0008), so one
        # place to rotate a key.
        - mgk_fitness_supabase
        # What only Run has: the basemap. Named for the suite, not the product,
        # for the same reason the bundle id is — the app's name is not settled
        # and this one does not need to care.
        - mgk_fitness_run_env
      flutter: stable
      xcode: latest
      cocoapods: default
    scripts:
      - name: Generate config/app_config.json from secure vars
        # Gitignored, because it carries dev-account credentials locally. The
        # app reads it via --dart-define-from-file, so a build without it comes
        # out unable to reach Supabase at all rather than failing loudly.
        #
        # **The dev accounts are written empty on purpose.** They are the
        # quick-sign-in and persona buttons, which are already kDebugMode-only
        # and tree-shaken out of a release — but a credential that is not in the
        # binary cannot be extracted from the binary, and this is a health app.
        script: |
          python3 - <<'PY'
          import json, os, pathlib, sys
          from urllib.parse import urlparse

          # Built with a JSON serialiser rather than a heredoc, because the
          # values are pasted into a web form by a human and arrive with
          # whatever that paste carried. The first build died on exactly this:
          #
          #   FormatException: Control character in string (at line 2, char 60)
          #
          # — a trailing carriage return on SUPABASE_URL, written verbatim into
          # the middle of a JSON string. json.dumps escapes; a heredoc does not.
          # .strip() removes the whitespace; the serialiser handles the rest.
          def need(name):
              v = (os.environ.get(name) or "").strip()
              if not v:
                  sys.exit(
                      f"{name} is empty. Set it in the mgk_fitness_supabase "
                      "group, or the IPA ships unable to reach Supabase."
                  )
              return v

          # Non-empty is not the same as usable. Build 9 shipped SUPABASE_URL as
          # a bare host with no scheme, so Uri.parse found no host and every
          # request died with "No host specified in URI ...". The app booted,
          # onboarding rendered, and the first sign-up was where it surfaced.
          # need() strips whitespace and rejects empty; this rejects the rest.
          def need_https(name):
              v = need(name)
              parsed = urlparse(v)
              if parsed.scheme != "https" or not parsed.netloc:
                  sys.exit(
                      f"{name} must be a full https URL with a host, e.g. "
                      f"https://<project-ref>.supabase.co - got {v!r}. Fix it "
                      "in the mgk_fitness_supabase group."
                  )
              return v

          # Optional, unlike the two above: the app runs without a basemap, it
          # just draws the route on charcoal. The first TestFlight build did
          # exactly that and looked broken, because this was never passed
          # through — AppConfig.hasBasemap is false on an empty string and the
          # map has nothing to fetch.
          #
          # Whatever provider goes here must be the one the privacy policy
          # names. That is the reason the app reads a template rather than
          # hard-coding a tile server.
          tiles = (os.environ.get("MAP_TILE_URL_TEMPLATE") or "").strip()
          attribution = (os.environ.get("MAP_ATTRIBUTION") or "").strip()

          # RevenueCat's PUBLIC SDK key. Optional in the same sense the basemap
          # is: without it the app runs, the coach gate explains what a
          # subscription buys, and there is no button to press. The secret that
          # matters is REVENUECAT_WEBHOOK_SECRET, which lives in Supabase and is
          # never built into an IPA.
          revenuecat = (os.environ.get("REVENUECAT_PUBLIC_KEY") or "").strip()

          # Same banner treatment as the basemap, and for the same reason: a
          # TestFlight build that silently cannot sell anything looks identical
          # to one that can until somebody taps the gate.
          if not revenuecat:
              print("=" * 72)
              print("WARNING: REVENUECAT_PUBLIC_KEY is unset.")
              print("This build CANNOT TAKE A PAYMENT. The coach gate will say")
              print("so rather than offering a button, which is the honest")
              print("state but not a testable one.")
              print("Set it in the mgk_fitness_run_env group.")
              print("=" * 72)

          # The iOS key begins appl_. A Google or a web key here would configure
          # the SDK against the wrong store and fail at the moment of purchase,
          # which is the one moment worth failing early instead.
          if revenuecat and not revenuecat.startswith("appl_"):
              sys.exit(
                  "REVENUECAT_PUBLIC_KEY must be the Apple key, which begins "
                  f"appl_ - got {revenuecat[:8]!r}... Check Project settings "
                  "> API keys in RevenueCat."
              )

          # Loud, not a print. The first TestFlight build shipped with no
          # basemap and nobody noticed until a run was recorded against a
          # charcoal void, because the only signal was one line in the middle
          # of a passing log. A banner survives skim-reading.
          if not tiles:
              print("=" * 72)
              print("WARNING: MAP_TILE_URL_TEMPLATE is unset.")
              print("This build ships WITHOUT A BASEMAP: run routes draw on")
              print("bare charcoal. That is a legitimate build state, but it")
              print("is almost certainly not the one you wanted for TestFlight.")
              print("Set it in the mgk_fitness_run_env group.")
              print("=" * 72)

          # Attribution is not decorative — every provider's terms require
          # visible credit, so tiles without it is a breach. Failing the build
          # is the only way that stays true: the app cannot detect it, and a
          # reviewer will not.
          if tiles and not attribution:
              sys.exit(
                  "MAP_TILE_URL_TEMPLATE is set but MAP_ATTRIBUTION is empty. "
                  "Serving a provider's tiles without their credit breaches "
                  "their terms. Set both, or neither."
              )

          cfg = {
              "SUPABASE_URL": need_https("SUPABASE_URL"),
              "SUPABASE_PUBLISHABLE_KEY": need("SUPABASE_PUBLISHABLE_KEY"),
              "MAP_TILE_URL_TEMPLATE": tiles,
              "MAP_ATTRIBUTION": attribution,
              "REVENUECAT_PUBLIC_KEY": revenuecat,
              # Empty on purpose — see the note above.
              "DEV_ACCOUNT_1_LABEL": "",
              "DEV_ACCOUNT_1_EMAIL": "",
              "DEV_ACCOUNT_1_PASSWORD": "",
          }

          out = pathlib.Path(os.environ["CM_BUILD_DIR"]) / "apps/mgk_run/config/app_config.json"
          out.parent.mkdir(parents=True, exist_ok=True)
          out.write_text(json.dumps(cfg, indent=2))
          print(f"wrote {out} ({len(cfg)} keys)")
          PY
      - name: Flutter packages
        script: flutter pub get
      - name: Generate code
        # Drift's generated sources are gitignored, so this is not optional:
        # without it the local database does not compile.
        script: dart run build_runner build --delete-conflicting-outputs
      - name: Install CocoaPods
        script: find . -name "Podfile" -execdir pod install \;
      - name: Set up code signing
        # Applies the profile Codemagic fetched during environment setup. It
        # FETCHES; it does not create. The first build for this bundle id
        # failed here with "No matching profiles found for bundle identifier
        # ... and distribution type app_store", because an App ID is not a
        # provisioning profile and nothing had made one.
        #
        # See setup step 5 above: the profile is created once, by hand, in the
        # Apple Developer portal. After that every build finds it.
        script: xcode-project use-profiles
      - name: Build IPA
        # --dart-define-from-file is load-bearing: AppConfig reads every value
        # from it, so an IPA built without this flag launches and then cannot
        # sign anybody in.
        #
        # NO --build-number, deliberately. The build number is `version:` in
        # apps/mgk_run/pubspec.yaml and nowhere else, which is where Flutter
        # reads it from when the flag is absent.
        #
        # It used to be $PROJECT_BUILD_NUMBER. That is Codemagic's PROJECT-wide
        # counter — "Number of the build for this project", incrementing on
        # every workflow run, not per workflow ($BUILD_NUMBER is the per-workflow
        # one). Two things followed, and both were invisible because the stores
        # only require the number to increase:
        #
        #   1. iOS and Android built from the SAME commit got numbers one apart,
        #      because they are two workflow runs. The note on the Android side
        #      claimed the shared variable stopped the two stores disagreeing
        #      about which build is newer. Same variable is not the same value.
        #   2. A Lift build moved Run's next number. "Build 14" meant the
        #      project's 14th build, not Run's.
        #
        # The cost of this fix is a manual bump before each submission, and a
        # repeated number is refused at upload. The gain is that the number is
        # in git, on the commit that gets tagged, and one string feeds both
        # stores — which is what actually keeps them in agreement.
        script: |
          flutter build ipa --release \
            --dart-define-from-file=config/app_config.json \
            --export-options-plist=/Users/builder/export_options.plist
    artifacts:
      # **Both, deliberately.** A build that compiles and publishes nothing is
      # the worst outcome available: every step reports success, the log says
      # "No artifacts were found", and TestFlight stays empty. That is what
      # happened on build 3, because these globs resolve relative to
      # `working_directory` and the pattern was written relative to the clone
      # root — with a comment confidently asserting the opposite.
      #
      # Codemagic ignores a pattern that matches nothing, so listing both costs
      # nothing and removes the guess.
      - build/ios/ipa/*.ipa
      - apps/mgk_run/build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        # submit_to_app_store: false   # flip on when ready for a store release

  # ──────────────────────────────────────────────────────────────
  # Run — does the iPhone app compile? Nothing is signed and nothing is sent.
  #
  # The app has two targets since build 29: Runner, and the RunLiveActivity
  # widget extension that draws a run's figures on the lock screen (ADR-0045).
  # Nobody here has a Mac, so the extension and the Xcode project entries for
  # it were written by hand, and the release workflow above is a slow and
  # expensive way to learn that a Swift file does not compile: it needs a
  # provisioning profile for every target before it will build any of them.
  #
  # This builds both targets unsigned. It needs no profile, no App Store
  # Connect key and no secrets (the config it compiles against is a
  # placeholder), so it can run before the signing is in place and after any
  # change to `apps/mgk_run/ios/`.
  run-ios-compile:
    name: Run — iOS compile check
    instance_type: mac_mini_m2
    max_build_duration: 30
    cache:
      cache_paths:
        - $HOME/.pub-cache
        - $CM_BUILD_DIR/apps/mgk_run/ios/Pods
    working_directory: apps/mgk_run
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
    scripts:
      - name: A placeholder config to compile against
        script: |
          mkdir -p config
          python3 - <<'PY'
          import json, pathlib
          pathlib.Path("config/app_config.json").write_text(json.dumps({
              "SUPABASE_URL": "https://example.supabase.co",
              "SUPABASE_PUBLISHABLE_KEY": "compile-check-only",
          }))
          PY
      - name: Flutter packages
        script: flutter pub get
      - name: Generate code
        script: dart run build_runner build --delete-conflicting-outputs
      - name: Compile Runner and its extension, unsigned
        script: |
          flutter build ios --release --no-codesign \
            --dart-define-from-file=config/app_config.json
    artifacts:
      - /tmp/xcodebuild_logs/*.log

  # ─────────────────────────────────────────────────────────────────────────
  # Lift — see apps/mgk_lift/docs/submission-week.md for the release this feeds.
  #
  # ONE-TIME SETUP, beyond what Run already established:
  #
  #  1. **No environment group of its own.** `AppConfig` reads exactly the two
  #     values already in `mgk_fitness_supabase` (setup 3a), so Lift references
  #     that and nothing else — Run's map and dev-account variables have no
  #     equivalent here, and an empty `mgk_fitness_lift_env` would only be a
  #     place for a future secret to land without anyone deciding it should.
  #     The OpenRouter key lives in Supabase secrets and never reaches the
  #     client (ADR-0007).
  #
  #  2. **Nothing to create in App Store Connect.** The record exists — it is
  #     Liftio, id 6759969740, shipping 1.4.0 today. This uploads 2.0.0 to the
  #     same record, which is the entire point of ADR-0001.
  #
  #  3. **An App Store distribution provisioning profile for
  #     `com.mgkcodes.liftio`.** developer.apple.com ▸ Certificates, Identifiers
  #     & Profiles ▸ Profiles ▸ + ▸ Distribution ▸ App Store Connect, pick the
  #     App ID and the existing Apple Distribution certificate. Nothing to
  #     download — Codemagic fetches it through the API key.
  #
  #     Not optional and not inherited: the first build failed here, exactly as
  #     Run's did. Note the failure lands during ENVIRONMENT SETUP, before any
  #     script runs, because `ios_signing` below resolves at that point — so the
  #     build reports no script output at all, which reads like a broken config
  #     rather than a missing prerequisite.
  #
  #     Lift's App ID has one capability, Sign in with Apple (2026-09-30, the
  #     redesign's R10); no HealthKit, no push. Camera and photo library are
  #     Info.plist usage strings, not App ID capabilities. The profile needs
  #     regenerating whenever that list changes; a profile is a snapshot of
  #     the App ID's capabilities at the moment it was made.
  #
  # The App Store Connect API key is the same as Run's, `mgkfitness_asc`
  # (setup note 2): one key for the MGKFitness apps, none of Frunt's.
  # ─────────────────────────────────────────────────────────────────────────
  lift-ios-release:
    name: Lift — iOS TestFlight
    instance_type: mac_mini_m2
    max_build_duration: 45

    cache:
      cache_paths:
        - $HOME/.pub-cache
        - $CM_BUILD_DIR/apps/mgk_lift/ios/Pods
    working_directory: apps/mgk_lift
    integrations:
      # Only for `publishing` at the foot of this workflow: the TestFlight
      # upload authenticates with this key. Signing does not go through it;
      # see `ios_signing` below.
      app_store_connect: mgkfitness_asc
    environment:
      ios_signing:
        # Manual signing, where Run uses `distribution_type` +
        # `bundle_identifier`. The automatic form asks Codemagic to fetch a
        # matching profile from App Store Connect at build time, and for
        # `com.mgkcodes.liftio` that fetch has never once succeeded — five
        # builds (7d758a2 on 2026-08-18; 6a87ad71 / 6a87afcd / 6a87b020 /
        # 6a885451 on 2026-08-21), every one with `startedAt` null, so no
        # machine ever started and nothing about the build itself was reached.
        #
        # Ruled out, each with evidence rather than assumption: the bundle id
        # (yaml and pbxproj match exactly), the Apple team (all six profiles
        # live in ZTS7SQYSA5, and Run's fetch works from the same key), and
        # profile type (App Store, no provisioned devices).
        #
        # The team holds THREE distribution certificates: a legacy `iPhone
        # Distribution` expiring 2027-03-03 that EAS created (Lift's until
        # 2026-09-30), an `Apple Distribution` expiring 2027-06-03 that is
        # Frunt's, and MGKFitness's own `Apple Distribution` expiring
        # 2027-09-30, which both apps now use (setup note 6). Re-pointing
        # Lift's profile at a newer certificate did NOT fix the fetch —
        # 6a885451 failed identically — so the fetch failure remains genuinely
        # unexplained. Do not spend another build on a theory.
        #
        # These are reference names in Codemagic ▸ Teams ▸ Code signing
        # identities, NOT files in this repo — setup note 6 above. Uploading
        # the pair once is the price of not depending on that fetch.
        # Quoted because these are reference names typed into the Codemagic
        # UI, not identifiers — spaces are legal in them and these have some.
        provisioning_profiles:
          - "Lift MGKFitness App Store"
        certificates:
          - "mgkfitness_distribution"
      groups:
        - mgk_fitness_supabase
        # Lift's own group, for RevenueCat's two public SDK keys
        # (REVENUECAT_PUBLIC_KEY = appl_…, REVENUECAT_GOOGLE_KEY = goog_…).
        # The note that used to sit here said Lift needed no group of its own
        # because it had no secret of its own; payments gave it one. Same
        # variable names as Run's group, because each build reads only its own.
        #
        # The group has existed in Codemagic since 1 October 2026, with both
        # keys in it. It was commented out here until then: whether a workflow
        # naming a missing group fails is undocumented, and a failure there
        # lands before any script runs.
        - mgk_fitness_lift_env
      flutter: stable
      xcode: latest
      cocoapods: default
    scripts:
      - name: Generate config/app_config.json from secure vars
        # Same JSON-serialiser approach as Run, and for the same reason: these
        # values are pasted into a web form by a human, and Run's first build
        # died on a trailing carriage return written verbatim into the middle of
        # a JSON string. json.dumps escapes; a heredoc does not.
        script: |
          python3 - <<'PY'
          import json, os, pathlib, sys
          from urllib.parse import urlparse

          def need(name):
              v = (os.environ.get(name) or "").strip()
              if not v:
                  sys.exit(
                      f"{name} is empty. Set it in the mgk_fitness_supabase "
                      "group, or the IPA ships unable to reach Supabase."
                  )
              return v

          # Non-empty is not the same as usable. Build 9 shipped SUPABASE_URL as
          # a bare host with no scheme, so Uri.parse found no host and every
          # request died with "No host specified in URI ...". The app booted,
          # onboarding rendered, and the first sign-up was where it surfaced.
          # need() strips whitespace and rejects empty; this rejects the rest.
          def need_https(name):
              v = need(name)
              parsed = urlparse(v)
              if parsed.scheme != "https" or not parsed.netloc:
                  sys.exit(
                      f"{name} must be a full https URL with a host, e.g. "
                      f"https://<project-ref>.supabase.co - got {v!r}. Fix it "
                      "in the mgk_fitness_supabase group."
                  )
              return v

          # RevenueCat's PUBLIC key for Lift's App Store app. Optional in the
          # sense Run's is: without it the paywall says subscriptions are not
          # open and offers no button. Lift's own key, from
          # mgk_fitness_lift_env — never Run's, which configures the SDK against
          # the wrong app and sells Run's products.
          revenuecat = (os.environ.get("REVENUECAT_PUBLIC_KEY") or "").strip()
          if not revenuecat:
              print("=" * 72)
              print("WARNING: REVENUECAT_PUBLIC_KEY is unset.")
              print("This build CANNOT TAKE A PAYMENT. The paywall says")
              print("subscriptions are not open rather than offering a button.")
              print("Set it in the mgk_fitness_lift_env group, and uncomment")
              print("that group in this workflow.")
              print("=" * 72)
          elif not revenuecat.startswith("appl_"):
              sys.exit(
                  "REVENUECAT_PUBLIC_KEY must be Lift's Apple key, which begins "
                  f"appl_ - got {revenuecat[:8]!r}... RevenueCat > Project "
                  "settings > API keys, the key for the Lift App Store app."
              )

          cfg = {
              "SUPABASE_URL": need_https("SUPABASE_URL"),
              "SUPABASE_PUBLISHABLE_KEY": need("SUPABASE_PUBLISHABLE_KEY"),
              "REVENUECAT_PUBLIC_KEY": revenuecat,
          }

          out = pathlib.Path(os.environ["CM_BUILD_DIR"]) / "apps/mgk_lift/config/app_config.json"
          out.parent.mkdir(parents=True, exist_ok=True)
          out.write_text(json.dumps(cfg, indent=2))
          print(f"wrote {out} ({len(cfg)} keys)")
          PY
      - name: Flutter packages
        script: flutter pub get
      - name: Generate code
        # Drift's generated sources are gitignored, so this is not optional:
        # without it the local database does not compile. Lift leans on drift
        # harder than Run does — the whole training log is local-first.
        script: dart run build_runner build --delete-conflicting-outputs
      - name: Install CocoaPods
        script: find . -name "Podfile" -execdir pod install \;
      - name: Set up code signing
        script: xcode-project use-profiles
      - name: Build IPA
        # --dart-define-from-file is load-bearing: AppConfig reads both values
        # from it, so an IPA built without this flag launches and then cannot
        # sign anybody in.
        script: |
          flutter build ipa --release \
            --build-number=$(($PROJECT_BUILD_NUMBER)) \
            --dart-define-from-file=config/app_config.json \
            --export-options-plist=/Users/builder/export_options.plist
    artifacts:
      # Both patterns, as Run learned the hard way: these globs resolve relative
      # to `working_directory`, a pattern that matches nothing is ignored
      # silently, and the failure mode is a green build with an empty TestFlight.
      - build/ios/ipa/*.ipa
      - apps/mgk_lift/build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        # submit_to_app_store: false   # flip on when ready for a store release

  # ─────────────────────────────────────────────────────────────────────────
  # Lift — Android. The suite's first Android release of anything.
  #
  # Runs on Linux, not macOS: nothing here needs Xcode, and the macOS instance
  # costs several times as much per minute. The iOS workflow above is on mac
  # because it has to be, not because the suite standardises on it.
  #
  # ONE-TIME SETUP:
  #
  #  1. **An upload keystore**, created once and backed up somewhere that is not
  #     this repository. **It is already made** — one key signs every MGKCodes
  #     Android app, and Run created it on 2026-09-10:
  #
  #       keytool -genkey -v -keystore mgkfitness-upload.jks \
  #         -keyalg RSA -keysize 2048 -validity 10000 -alias upload
  #
  #     Upload it to Codemagic ▸ Team settings ▸ Code signing identities ▸
  #     Android keystores, referenced below as `mgkfitness_upload`. Codemagic then
  #     exports CM_KEYSTORE_PATH / CM_KEYSTORE_PASSWORD / CM_KEY_ALIAS /
  #     CM_KEY_PASSWORD, which `app/build.gradle.kts` reads in preference to a
  #     local `key.properties`. The build REFUSES to fall back to the debug key
  #     on a CI machine, because Play accepts that upload and rejects it after.
  #
  #  2. **A Google Play service account.** Play Console ▸ Setup ▸ API access ▸
  #     link a Google Cloud project, create a service account, grant it Release
  #     manager. Download the JSON and paste it into a secure variable named
  #     GCLOUD_SERVICE_ACCOUNT_CREDENTIALS in the group below.
  #
  #  3. **Upload the first bundle BY HAND.** The Play Developer API cannot
  #     create an app listing — it can only add a release to one that exists —
  #     so the very first `.aab` has to go through the Play Console UI, along
  #     with the store listing, content rating and Data safety form. Every build
  #     after that publishes through this workflow. Set `publishing` aside until
  #     then: with no listing, the upload step fails after a successful build,
  #     which reads like a broken pipeline rather than a missing prerequisite.
  #
  # There is no App Store Connect integration here and no `ios_signing`; an
  # Android build needs neither, and naming them would imply Apple credentials
  # were involved in shipping to Google.
  # ─────────────────────────────────────────────────────────────────────────
  lift-android-release:
    name: Lift — Android internal
    # macOS, not Linux — see the long note in `run-android-release`. Linux is a
    # paid-plan instance this account does not have, and a workflow declaring it
    # fails before a machine starts.
    instance_type: mac_mini_m2
    max_build_duration: 45

    cache:
      cache_paths:
        - $HOME/.pub-cache
        # Gradle's cache, which is most of a cold Android build's minutes.
        # Not build/, for the same reason the iOS workflow does not cache it:
        # stale generated output is how a green build ships yesterday's code.
        - $HOME/.gradle/caches
    working_directory: apps/mgk_lift
    environment:
      android_signing:
        # The suite-wide key, same as run-android-release. This said
        # `liftio_upload` until 2026-09-10 and **no such keystore had ever been
        # uploaded to Codemagic** — the only one there was frunt's. So this
        # workflow would have failed on its first run, and nothing said so,
        # because it has never had a Play listing to publish to.
        - mgkfitness_upload
      groups:
        - mgk_fitness_supabase
        # Lift's RevenueCat keys — see lift-ios-release.
        - mgk_fitness_lift_env
      flutter: stable
    scripts:
      - name: Generate config/app_config.json from secure vars
        # The same backend values as the iOS workflow's, deliberately: a second
        # copy that drifts would mean one platform quietly shipping a different
        # backend. The store key is the one difference, and it is meant to be.
        script: |
          python3 - <<'PY'
          import json, os, pathlib, sys
          from urllib.parse import urlparse

          def need(name):
              v = (os.environ.get(name) or "").strip()
              if not v:
                  sys.exit(
                      f"{name} is empty. Set it in the mgk_fitness_supabase "
                      "group, or the bundle ships unable to reach Supabase."
                  )
              return v

          # Non-empty is not the same as usable. Build 9 shipped SUPABASE_URL as
          # a bare host with no scheme, so Uri.parse found no host and every
          # request died with "No host specified in URI ...". The app booted,
          # onboarding rendered, and the first sign-up was where it surfaced.
          # need() strips whitespace and rejects empty; this rejects the rest.
          def need_https(name):
              v = need(name)
              parsed = urlparse(v)
              if parsed.scheme != "https" or not parsed.netloc:
                  sys.exit(
                      f"{name} must be a full https URL with a host, e.g. "
                      f"https://<project-ref>.supabase.co - got {v!r}. Fix it "
                      "in the mgk_fitness_supabase group."
                  )
              return v

          # REVENUECAT_GOOGLE_KEY, not REVENUECAT_PUBLIC_KEY: RevenueCat issues
          # one key per store app and an appl_ key here configures nothing.
          revenuecat = (os.environ.get("REVENUECAT_GOOGLE_KEY") or "").strip()
          if not revenuecat:
              print("=" * 72)
              print("WARNING: REVENUECAT_GOOGLE_KEY is unset.")
              print("This build CANNOT TAKE A PAYMENT. The paywall says")
              print("subscriptions are not open rather than offering a button.")
              print("Set it in the mgk_fitness_lift_env group, and uncomment")
              print("that group in this workflow.")
              print("=" * 72)
          elif not revenuecat.startswith("goog_"):
              sys.exit(
                  "REVENUECAT_GOOGLE_KEY must be Lift's Google key, which begins "
                  f"goog_ - got {revenuecat[:8]!r}... RevenueCat > Project "
                  "settings > API keys, the key for the Lift Play Store app."
              )

          cfg = {
              "SUPABASE_URL": need_https("SUPABASE_URL"),
              "SUPABASE_PUBLISHABLE_KEY": need("SUPABASE_PUBLISHABLE_KEY"),
              "REVENUECAT_GOOGLE_KEY": revenuecat,
          }

          out = pathlib.Path(os.environ["CM_BUILD_DIR"]) / "apps/mgk_lift/config/app_config.json"
          out.parent.mkdir(parents=True, exist_ok=True)
          out.write_text(json.dumps(cfg, indent=2))
          print(f"wrote {out} ({len(cfg)} keys)")
          PY
      - name: Flutter packages
        script: flutter pub get
      - name: Generate code
        script: dart run build_runner build --delete-conflicting-outputs
      - name: Build AAB
        # An app bundle, not an APK: Play has required .aab for new apps since
        # 2021, and this listing does not exist yet, so there is no legacy APK
        # path available even as a fallback.
        #
        # --build-number drives versionCode, which Play requires to increase on
        # every upload and never repeat. Same source as the iOS build number so
        # the two stores cannot disagree about which build is newer.
        script: |
          flutter build appbundle --release \
            --build-number=$(($PROJECT_BUILD_NUMBER)) \
            --dart-define-from-file=config/app_config.json
    artifacts:
      - build/app/outputs/bundle/**/*.aab
      - apps/mgk_lift/build/app/outputs/bundle/**/*.aab
      # The mapping file. Without it Play shows obfuscated stack traces and
      # there is no way to symbolicate a crash after the fact.
      - build/app/outputs/mapping/**/mapping.txt
      - apps/mgk_lift/build/app/outputs/mapping/**/mapping.txt
    # Commented until the listing exists — see setup step 3. Uncommenting before
    # the first manual upload turns a working build into a failing one.
    # publishing:
    #   google_play:
    #     credentials: $GCLOUD_SERVICE_ACCOUNT_CREDENTIALS
    #     track: internal
    #     submit_as_draft: true

  run-android-release:
    name: Run — Android
    # Linux, not macOS: an Android build has no reason to run on a Mac instance
    # and a metered plan charges the difference. This is the cheapest machine
    # Codemagic offers that can build Flutter for Android.
    #
    # ALL OF WHICH IS TRUE AND NONE OF WHICH SURVIVED THE BILLING PLAN. This
    # said `linux_x2` until 2026-09-10, when the first build that ever tried it
    # died before starting: "The selected instance type is not available with
    # the current billing plan." Linux is a paid-plan instance here; macOS is
    # the one this account has. So the cheapest machine Codemagic offers is not
    # the cheapest machine available to us, and the argument above was reasoning
    # about a catalogue rather than about an account.
    #
    # macOS builds Android perfectly well — the image carries the JDK and the
    # Android SDK, and it is what the iOS workflows already run on. It costs
    # more per minute than Linux would; Linux costs a plan upgrade, so this is
    # cheaper today. Revisit if Android builds become frequent enough that the
    # per-minute difference outweighs the subscription.
    instance_type: mac_mini_m2
    max_build_duration: 30
    cache:
      cache_paths:
        - $HOME/.pub-cache
        - $HOME/.gradle/caches
    working_directory: apps/mgk_run
    environment:
      android_signing:
        # The upload keystore, uploaded to Codemagic once under this reference
        # name. Declaring it is what exports CM_KEYSTORE_PATH and its three
        # companions, which apps/mgk_run/android/app/build.gradle.kts reads.
        #
        # ONE UPLOAD KEY FOR EVERY MGKFITNESS APP. A Play listing records
        # the upload certificate it expects; nothing requires that certificate
        # to be unique to one listing, and the same key signs Run, Lift and
        # whatever comes after.
        #
        # This said `run_upload` for a few hours on 2026-09-10, on the reasoning
        # that a compromise or a reset on one listing would reach the other "for
        # no benefit at all". The last clause was simply false — the benefit is
        # one secret to hold, back up and not lose, which for a studio this size
        # outweighs a blast radius neither of us could name a scenario for. Both
        # failure modes are recoverable the same way regardless: Google resets a
        # lost or compromised upload key by support request.
        #
        # frunt is the permanent exception. It is live on Play under
        # `frunt_upload`, and a shipped listing's upload key cannot be swapped
        # without going through that same support request for no gain.
        - mgkfitness_upload
      groups:
        # The same two groups as iOS, and the split is deliberate: the Supabase
        # values belong to the suite (ADR-0008 — one project for both apps), the
        # map values belong to Run.
        #
        # This comment used to argue against splitting them, on the grounds that
        # one group avoided maintaining the same keys in two places. That was
        # answered rather than ignored: the values are not duplicated, they are
        # each in exactly one group, and Lift references the Supabase one
        # instead of keeping a copy. Attach only the second and the build
        # installs SDKs, sets up signing, and dies half a second into the config
        # step on an empty SUPABASE_URL.
        - mgk_fitness_run_env
        - mgk_fitness_supabase
        # Holds GCLOUD_SERVICE_ACCOUNT_CREDENTIALS — the whole Play Developer
        # API service-account JSON, pasted as a secure string.
        #
        # `mgk-fitness-play-publisher@mgk-fitness.iam.gserviceaccount.com`,
        # created 2026-09-10 in its own GCP project. **Deliberately not frunt's
        # `frunt-play-publisher`**, which was sitting there and would have
        # worked: this credential does two jobs for the suite, publishing
        # builds AND validating every Play purchase for RevenueCat, and those
        # have very different rotation costs. Rotating a publish-only key is an
        # inconvenience; rotating one RevenueCat depends on costs up to 36
        # hours of degraded purchase validation. Sharing one credential across
        # both products would let a rotation forced by frunt drag Run and
        # Lift's billing through that window for reasons of its own.
        #
        # Suite-scoped rather than Run-scoped for the same reason the RevenueCat
        # project is: Lift joins it, and wants this exact credential.
        #
        # LIVE SINCE 2026-09-10, in step with the `publishing:` block at the end
        # of this workflow. They are one switch: this group exists only to feed
        # that block, and Codemagic fails a build outright on a group name it
        # cannot resolve, so referencing it while publishing was off broke a
        # build over a credential it never read. If publishing is ever turned
        # back off, comment this out with it.
        - mgk_fitness_play
      flutter: stable
      java: 17
    scripts:
      # Byte-for-byte the same generation step as the iOS workflow. It is
      # duplicated rather than shared because Codemagic has no include
      # mechanism for script bodies; if one changes the other has to.
      - name: Generate config/app_config.json from secure vars
        script: |
          mkdir -p config
          # REVENUECAT_GOOGLE_KEY, not REVENUECAT_PUBLIC_KEY. The two keys are
          # different strings and the wrong one does not degrade — the SDK
          # fails to configure, `offers()` returns nothing, and the paywall
          # renders as an empty shop with no error anywhere. `AppConfig.storeKey`
          # reads the Google one on Android; handing this step the Apple key
          # would produce a build that looks able to sell and cannot.
          if [ -z "${REVENUECAT_GOOGLE_KEY:-}" ]; then
            echo "WARNING: REVENUECAT_GOOGLE_KEY is unset. This build cannot"
            echo "take a payment on Android — the coach gate will explain the"
            echo "subscription with no button. That is the correct state for"
            echo "the FIRST upload (Play will not create in-app products until"
            echo "an AAB exists), and a defect for every upload after it."
          else
            case "$REVENUECAT_GOOGLE_KEY" in
              goog_*) ;;
              *)
                echo "REVENUECAT_GOOGLE_KEY must be the Google key, which"
                echo "begins goog_. An appl_ key here configures nothing."
                exit 1
                ;;
            esac
          fi
          # Written by Python, not a shell heredoc. The heredoc put each
          # variable between quotes exactly as Codemagic held it, so a value
          # saved with a trailing newline made the file invalid JSON: build 27
          # died here in three seconds, on MAP_TILE_URL_TEMPLATE, with
          # "Control character in string", while the iOS workflow built from
          # the same variable because it has always stripped and escaped.
          python3 - <<'PY'
          import json, os, pathlib, sys

          def var(name):
              return (os.environ.get(name) or "").strip()

          cfg = {
              "SUPABASE_URL": var("SUPABASE_URL"),
              "SUPABASE_PUBLISHABLE_KEY": var("SUPABASE_PUBLISHABLE_KEY"),
              "MAP_TILE_URL_TEMPLATE": var("MAP_TILE_URL_TEMPLATE"),
              "MAP_ATTRIBUTION": var("MAP_ATTRIBUTION"),
              "REVENUECAT_GOOGLE_KEY": var("REVENUECAT_GOOGLE_KEY"),
          }
          # The same refusal the iOS workflow makes: a provider's tiles
          # without their credit breaches their terms.
          if cfg["MAP_TILE_URL_TEMPLATE"] and not cfg["MAP_ATTRIBUTION"]:
              sys.exit(
                  "MAP_TILE_URL_TEMPLATE is set but MAP_ATTRIBUTION is empty. "
                  "Set both, or neither."
              )
          pathlib.Path("config/app_config.json").write_text(json.dumps(cfg, indent=2))
          print(f"wrote config/app_config.json ({len(cfg)} keys)")
          PY
      - name: Flutter packages
        script: flutter pub get
      - name: Generate code
        script: dart run build_runner build --delete-conflicting-outputs
      - name: Analyze
        script: flutter analyze
      - name: Test
        # Cheap here in a way it is not on a Mac instance, and this suite is the
        # only thing that checks the in-run screen against real phone widths.
        script: flutter test
      - name: Build AAB
        # An app bundle, not an APK: Play has required .aab for new apps since
        # 2021, and this listing does not exist yet, so there is no legacy APK
        # path available even as a fallback.
        #
        # --dart-define-from-file is load-bearing for the same reason it is on
        # iOS: AppConfig reads every value from it, and a build without it
        # launches and then cannot sign anybody in.
        #
        # No --build-number: it comes from apps/mgk_run/pubspec.yaml, the same
        # string run-ios-release reads, which is what actually makes the two
        # stores agree about which build is newer. See the long note in
        # run-ios-release for what the $PROJECT_BUILD_NUMBER version got wrong.
        # Play requires versionCode to increase and never repeat, which the
        # pubspec string already guarantees across both stores.
        script: |
          flutter build appbundle --release \
            --dart-define-from-file=config/app_config.json
      - name: Build APK
        # Kept alongside the bundle, and not as a fallback: an .aab cannot be
        # sideloaded onto a phone, so without this there is no artifact anyone
        # can install to test a Play build before it is a Play build.
        script: |
          flutter build apk --release \
            --dart-define-from-file=config/app_config.json
    artifacts:
      # Both paths for each, for the same reason the iOS workflow lists both:
      # these globs resolve relative to `working_directory`, and a build that
      # publishes nothing reports success with an empty artifact list.
      - build/app/outputs/bundle/**/*.aab
      - apps/mgk_run/build/app/outputs/bundle/**/*.aab
      - build/app/outputs/flutter-apk/*.apk
      - apps/mgk_run/build/app/outputs/flutter-apk/*.apk
      # The mapping file. Without it Play shows obfuscated stack traces and
      # there is no way to symbolicate a crash after the fact.
      - build/app/outputs/mapping/**/mapping.txt
      - apps/mgk_run/build/app/outputs/mapping/**/mapping.txt
    # LIVE SINCE 2026-09-10, and it could not have been before.
    #
    # Codemagic can publish to a track; it cannot create the listing, and the
    # Play Developer API refuses an app whose first bundle has never been
    # uploaded through the console. That upload happened on 2026-09-10 —
    # 1.0.0 (22), by hand, to internal testing — so this is now the one thing
    # that was actually blocking it.
    #
    # `submit_as_draft` was `true` here and is now `false`. The argument for
    # the draft was that a mistake becomes something to delete rather than
    # something somebody has installed — which describes a public track, not
    # this one. The internal track already only reaches a tester list, so the
    # draft guarded nothing and charged a manual rollout per build. See the
    # note on the flag itself for what that cost on build 24.
    #
    # THE `mgk_fitness_play` GROUP ABOVE IS PART OF THIS. It holds the
    # credentials this block reads; turn one off and turn the other off with it,
    # or the build fails on a group it cannot resolve.
    #
    # Lift's equivalent, a few hundred lines up, stays commented — it has no
    # Play listing to publish to, and uncommenting it would fail on the listing
    # rather than on anything in this repository.
    publishing:
      google_play:
        # **This name is deprecated and has to change, but not on its own.**
        # Build 24's publish step warned, inside an otherwise green log:
        #
        #   Warning: Using environment variable GCLOUD_SERVICE_ACCOUNT_CREDENTIALS
        #   to define argument value is deprecated and will be removed in a
        #   future release. Use GOOGLE_PLAY_SERVICE_ACCOUNT_CREDENTIALS instead.
        #
        # Changing this line alone breaks publishing: the variable group holds
        # the old name, so the new one resolves to empty and the upload fails
        # with a credential error rather than a missing-variable one. The order
        # is: add GOOGLE_PLAY_SERVICE_ACCOUNT_CREDENTIALS to `mgk_fitness_play`
        # with the same JSON, THEN change this line, THEN delete the old
        # variable once a build has gone green.
        #
        # Left on the deprecated name deliberately. It still works, and a
        # warning is cheaper than a failed release.
        credentials: $GCLOUD_SERVICE_ACCOUNT_CREDENTIALS
        track: internal
        # **false, deliberately, and it was `true` until 2026-09-11.**
        #
        # The draft was written as a safety: "a mistake is a draft to delete
        # rather than a build someone has installed". That reasoning does not
        # survive contact with the internal track, which *is* the safety — it
        # reaches a tester list and nobody else. So the draft protected nothing
        # and cost a manual rollout on every build.
        #
        # It cost one on build 24, invisibly: the bundle uploaded, the build
        # went green, and the app never appeared for testers because the track
        # held `draft: [24]` behind `completed: [23]`. An hour went into
        # looking at the emulator for a fault that was in the release state.
        #
        # Keep it `true` for any track that reaches the public.
        submit_as_draft: false
