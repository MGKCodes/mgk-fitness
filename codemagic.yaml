# Codemagic CI/CD for the suite — Run and Lift
# (see apps/mgk_run/docs/decisions/0020-codemagic-is-the-build-path.md).
#
# Three manual-trigger workflows: Run → TestFlight, Lift → TestFlight, and
# Lift → Play. The iOS pair runs on macOS cloud machines, so shipping never
# depends on having a Mac to hand — which matters here, because both apps are
# developed on Windows against an Android emulator and neither has ever been
# built locally for its actual target. The Android one runs on Linux, because
# nothing about it needs Xcode and the macOS instance costs several times more
# per minute.
#
# **Run has no Android workflow, deliberately** (ADR-0001). Its Android build is
# a verification harness for design work on Windows, not a product, and a
# release pipeline would imply otherwise. That decision is Run's alone: Lift
# ships to both stores as part of 2.0.0, which is why the asymmetry below is
# intended rather than unfinished.
#
# ───────────────────────────────────────────────────────────────────────────
# ONE-TIME SETUP IN THE CODEMAGIC UI (referenced by name below):
#
#  1. Connect this repo to Codemagic.
#
#  0. **This file must sit at the REPOSITORY ROOT.** Codemagic reads
#     `codemagic.yaml` from the root of the clone and nowhere else, so while it
#     lived at `apps/mgk_run/codemagic.yaml` the build could not start at all —
#     it would report no configuration found. This is a monorepo, so the app it
#     builds is named by `working_directory` below rather than by where the
#     file sits.
#  2. App Store Connect API key → Team settings ▸ Integrations ▸ **Developer
#     Portal** ▸ Manage keys. Codemagic folded the App Store Connect key into
#     that integration; there is no separate "App Store Connect" row. One key
#     with App Manager covers signing AND the TestFlight upload, for every app
#     in the team — already present as `frunt_asc`, which is what the workflow
#     below references.
#  3a. Environment group `mgk_fitness_supabase` (Application settings ▸
#     Environment variables, mark Secure) with:
#       SUPABASE_URL              the shared MGKCodes fitness project (ADR-0008)
#       SUPABASE_PUBLISHABLE_KEY  the publishable (anon) key, NOT the service key
#
#     **Shared by every workflow in this file**, because ADR-0008 says there is
#     one Supabase project for the suite. Both apps read exactly these two
#     values, so a copy per app would mean a key rotation that silently half
#     lands — one product fixed, the other still pointed at a dead key, and no
#     build failure to say so. `AppConfig` treats missing values as "no server"
#     rather than as an error, so the symptom would be an app that ships and
#     cannot sign anybody in.
#
#  3b. Environment group `mgk_fitness_run_env`, same screen, for what only Run
#     has:
#       MAP_TILE_URL_TEMPLATE     optional. The tile server the privacy policy
#                                 names. Without it the run map draws the route
#                                 on charcoal with no basemap — which is what
#                                 the first TestFlight build did.
#       MAP_ATTRIBUTION           required WHENEVER MAP_TILE_URL_TEMPLATE is
#                                 set, and unused otherwise. Every provider
#                                 worth using requires visible credit, so a
#                                 basemap with no attribution is a terms
#                                 breach rather than a cosmetic omission. The
#                                 build refuses the pair half-set.
#     Nothing else belongs in either group. The OpenRouter key lives in Supabase
#     secrets and never reaches the client (ADR-0007); a provider key here would
#     be a provider key in the app bundle.
#  5. **An App Store distribution provisioning profile for
#     `com.mgkcodes.fitness.run`.** developer.apple.com ▸ Certificates,
#     Identifiers & Profiles ▸ Profiles ▸ + ▸ Distribution ▸ App Store Connect,
#     pick the App ID and the existing Apple Distribution certificate.
#
#     Create it AFTER the App ID's capabilities are set — a profile is a
#     snapshot of them, so ticking HealthKit later means regenerating this.
#     Nothing to download; Codemagic fetches it through the API key.
#
#  4. App Store Connect → new app, bundle id `com.mgkcodes.fitness.run`.
#     **Not the product name, and deliberately so.** A bundle id is permanent
#     once the App Store Connect record exists, and the name is not settled;
#     `com.mgkcodes.runio` would have welded a working title to the app
#     forever. This one says what the app *is* — MGKCodes, the fitness suite,
#     the running one — and survives any rename, because the name customers
#     see is CFBundleDisplayName and can change whenever you like. Required
#     before any TestFlight upload will be accepted.
#
#  6. **Lift only — the signing pair, uploaded by hand.** Everything above is
#     Run's. Lift does not fetch its profile at build time (see the note below
#     the setup block), so both halves have to sit in Codemagic ▸ Teams ▸ Code
#     signing identities:
#
#       iOS certificates       the .p12 AND its password, reference name
#                              `liftio_distribution`
#       Provisioning profiles  the .mobileprovision, reference name
#                              `liftio_app_store`
#
#     Those names are what `lift-ios-release` references below, so a typo there
#     fails the build with a profile that does not exist rather than one that
#     does not match. Both come out of EAS, which still holds the private key
#     for the certificate it generated — `eas credentials -p ios` in the old
#     Expo project, build profile `production`, then download credentials to
#     credentials.json. That yields `dist-cert.p12` and its password.
#
#     **Generate the profile in the Apple portal, not from EAS.** What EAS
#     hands back is its own cached `*[expo] …` blob, which is stale the moment
#     anything changes in the portal, and a deleted profile still signs
#     locally — it fails at the upload, after a full green build. Profiles ▸ +
#     ▸ Distribution ▸ App Store Connect ▸ the `com.mgkcodes.liftio` App ID ▸
#     the certificate **expiring 2027-03-03**, which is the one the .p12
#     contains. A profile whose certificate you do not hold the key for is the
#     failure this whole workflow exists to avoid.
#
#     Verify the pair before uploading, offline and in seconds: the profile is
#     a CMS-wrapped plist (`openssl smime -inform der -verify -noverify`), and
#     its `DeveloperCertificates[0]` must be byte-identical to the certificate
#     inside the .p12. If they differ, the build signs and then fails at the
#     end. A profile is also a snapshot of the App ID's capabilities, so
#     regenerate it after changing them — Lift has no entitlements file today,
#     but In-App Purchase arrives with payments.
# ───────────────────────────────────────────────────────────────────────────

# One workflow per app, all in this one file, because Codemagic reads exactly
# one codemagic.yaml — the repository root's — and this repo builds more than
# one product. Lift is a sibling of the block below, not a second file:
# its own `working_directory: apps/mgk_lift`, its own bundle identifier, its own
# environment group. Everything above this line — the key, the signing setup,
# the macOS instance — is shared.
#
# **Lift's identifier does NOT follow the pattern above.** It is
# `com.mgkcodes.liftio`, inherited from the app it replaces on an existing App
# Store record, so do not copy Run's `com.mgkcodes.fitness.*` shape across. See
# apps/mgk_lift/docs/decisions/0001-liftio-is-replaced-not-relaunched.md.
#
# An earlier version of this comment claimed the inherited App ID meant the
# provisioning profile came with it, so Run's first-build signing failure could
# not repeat. **It repeated.** Lift's first build (2026-08-18, commit 7d758a2)
# died with the identical message — "No matching profiles found for bundle
# identifier com.mgkcodes.liftio and distribution type app_store". An App Store
# record, an App ID and a distribution certificate are three things, and none of
# them is a provisioning profile. EAS managed Liftio's signing and left nothing
# behind that this pipeline can fetch.
#
# **Resolved by not fetching at all.** Three more identical failures on
# 2026-08-21 — after the profile had been created by hand, and with the bundle
# id, team and certificate each ruled out — moved Lift to manual signing: the
# certificate and profile are uploaded to Codemagic once and the fetch step
# stops existing. Run still fetches, because for Run it has always worked.
#
# Worth adding when there are two: a `triggering.when.changeset.includes` on
# each, so a commit that only touches Lift does not spend twenty minutes
# building Run. While both are manual-trigger only, it costs nothing.
workflows:
  # ───────────────────────────────────────────────────────────────────────────
  # The only workflow here that is not a build.
  #
  # Until this existed, NOTHING ran automatically: the three workflows below all
  # produce store artefacts, and the 188 Deno tests, 3 pgTAP suites and 292
  # Flutter tests were run by hand or not at all. A suite that only runs when
  # somebody remembers is a suite that is green because nobody looked.
  #
  # Linux, because none of it needs Xcode and the macOS instance costs several
  # times more per minute. The whole thing is minutes, mostly spent installing
  # tools rather than running tests — `deno test` alone is 188 tests in one
  # second.
  #
  # **Each layer is its own step on purpose.** One combined script would report
  # "tests failed" and leave you to find out which of four things broke; named
  # steps put the answer in the build list.
  # ───────────────────────────────────────────────────────────────────────────
  checks:
    name: Checks — Deno, pgTAP, Flutter
    instance_type: linux_x2
    max_build_duration: 20

    # Unlike the release workflows, this one is meant to run without being
    # asked. A check you have to trigger is a check you skip on the day you are
    # in a hurry, which is the day you needed it.
    triggering:
      events:
        - push
        - pull_request
      branch_patterns:
        - pattern: '*'
          include: true

    cache:
      cache_paths:
        - $HOME/.pub-cache
        - $HOME/.cache/deno

    environment:
      flutter: stable

    scripts:
      - name: Deno — coach function
        # No permission flags. The tests fake `fetch` rather than reaching the
        # network, which is why they are a second rather than a minute, and why
        # a red here is always the code rather than the weather.
        working_directory: supabase/functions/coach
        script: deno test

      - name: Deno — eval rules
        # The arithmetic half of the coach evals. Separate from the graded run,
        # which costs money, needs an account and is deliberately not a gate —
        # see supabase/evals/README.md. These are pure functions and belong
        # here with everything else that cannot be flaky.
        working_directory: supabase/evals
        script: deno test --allow-net=jsr.io

      - name: pgTAP — schema contracts
        # `supabase test db` spins Postgres in Docker, so this is the slowest
        # step by a distance. It earns it: coach_contract.sql asserts invariants
        # against the catalog rather than against migration text, which is the
        # only version of that check that survives a migration being edited.
        script: |
          curl -fsSL https://github.com/supabase/cli/releases/latest/download/supabase_linux_amd64.tar.gz             | tar -xz -C /tmp
          sudo mv /tmp/supabase /usr/local/bin/supabase
          supabase --version
          supabase test db

      - name: Flutter — packages and generated code
        # **Not optional.** `*.g.dart` is gitignored, so a fresh clone has no
        # drift sources and mgk_lift does not compile without this — the same
        # reason both release workflows carry the identical step. Analysing
        # before it runs reports a few hundred phantom errors about undefined
        # getters, which is a very convincing way to waste an afternoon.
        script: |
          flutter pub get
          cd apps/mgk_lift && dart run build_runner build --delete-conflicting-outputs

      - name: Flutter — analyze
        # mgk_run is excluded deliberately. Its drift sources would need
        # generating too, which doubles this step's runtime to analyse code
        # this workflow does not test and whose own release workflow already
        # covers it.
        script: flutter analyze apps/mgk_lift packages/mgk_ui

      - name: Flutter — mgk_ui
        working_directory: packages/mgk_ui
        script: flutter test

      - name: Flutter — mgk_lift
        working_directory: apps/mgk_lift
        script: flutter test

  run-ios-release:
    name: Run — iOS TestFlight
    instance_type: mac_mini_m2
    # A cap on waste, not a target. A build that finishes in twenty minutes is
    # billed twenty; this only bites when something hangs, and 60 meant an hour
    # of a metered plan spent on a wedged process. A cold Flutter iOS build with
    # a CocoaPods install lands well inside this.
    max_build_duration: 45

    # The single biggest saving on a metered plan. Without it every run
    # re-downloads the whole pub cache and rebuilds every pod, which is most of
    # a cold build's minutes and none of its value.
    #
    # Not cached: build/ and .dart_tool/, deliberately. Stale generated output
    # is how a green build ships yesterday's code, and drift's sources are
    # generated fresh each run for exactly that reason.
    cache:
      cache_paths:
        - $HOME/.pub-cache
        - $CM_BUILD_DIR/apps/mgk_run/ios/Pods
    # Every script below runs from the app, not the repo root. Without this the
    # first `flutter pub get` would run against the workspace root and build the
    # wrong thing — or nothing.
    working_directory: apps/mgk_run
    integrations:
      # Named for frunt because that product registered it first, but an App
      # Store Connect API key is issued to the TEAM, not to an app: the same
      # key signs and uploads everything under MGKCodes Ltd. Referenced rather
      # than duplicated because the .p8 downloads exactly once, so a second
      # entry would mean a second Apple key for no benefit.
      app_store_connect: frunt_asc
    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.mgkcodes.fitness.run
      groups:
        # The Supabase pair is shared with Lift — one project (ADR-0008), so one
        # place to rotate a key.
        - mgk_fitness_supabase
        # What only Run has: the basemap. Named for the suite, not the product,
        # for the same reason the bundle id is — the app's name is not settled
        # and this one does not need to care.
        - mgk_fitness_run_env
      flutter: stable
      xcode: latest
      cocoapods: default
    scripts:
      - name: Generate config/app_config.json from secure vars
        # Gitignored, because it carries dev-account credentials locally. The
        # app reads it via --dart-define-from-file, so a build without it comes
        # out unable to reach Supabase at all rather than failing loudly.
        #
        # **The dev accounts are written empty on purpose.** They are the
        # quick-sign-in and persona buttons, which are already kDebugMode-only
        # and tree-shaken out of a release — but a credential that is not in the
        # binary cannot be extracted from the binary, and this is a health app.
        script: |
          python3 - <<'PY'
          import json, os, pathlib, sys

          # Built with a JSON serialiser rather than a heredoc, because the
          # values are pasted into a web form by a human and arrive with
          # whatever that paste carried. The first build died on exactly this:
          #
          #   FormatException: Control character in string (at line 2, char 60)
          #
          # — a trailing carriage return on SUPABASE_URL, written verbatim into
          # the middle of a JSON string. json.dumps escapes; a heredoc does not.
          # .strip() removes the whitespace; the serialiser handles the rest.
          def need(name):
              v = (os.environ.get(name) or "").strip()
              if not v:
                  sys.exit(
                      f"{name} is empty. Set it in the mgk_fitness_supabase "
                      "group, or the IPA ships unable to reach Supabase."
                  )
              return v

          # Optional, unlike the two above: the app runs without a basemap, it
          # just draws the route on charcoal. The first TestFlight build did
          # exactly that and looked broken, because this was never passed
          # through — AppConfig.hasBasemap is false on an empty string and the
          # map has nothing to fetch.
          #
          # Whatever provider goes here must be the one the privacy policy
          # names. That is the reason the app reads a template rather than
          # hard-coding a tile server.
          tiles = (os.environ.get("MAP_TILE_URL_TEMPLATE") or "").strip()
          attribution = (os.environ.get("MAP_ATTRIBUTION") or "").strip()

          # Loud, not a print. The first TestFlight build shipped with no
          # basemap and nobody noticed until a run was recorded against a
          # charcoal void, because the only signal was one line in the middle
          # of a passing log. A banner survives skim-reading.
          if not tiles:
              print("=" * 72)
              print("WARNING: MAP_TILE_URL_TEMPLATE is unset.")
              print("This build ships WITHOUT A BASEMAP: run routes draw on")
              print("bare charcoal. That is a legitimate build state, but it")
              print("is almost certainly not the one you wanted for TestFlight.")
              print("Set it in the mgk_fitness_run_env group.")
              print("=" * 72)

          # Attribution is not decorative — every provider's terms require
          # visible credit, so tiles without it is a breach. Failing the build
          # is the only way that stays true: the app cannot detect it, and a
          # reviewer will not.
          if tiles and not attribution:
              sys.exit(
                  "MAP_TILE_URL_TEMPLATE is set but MAP_ATTRIBUTION is empty. "
                  "Serving a provider's tiles without their credit breaches "
                  "their terms. Set both, or neither."
              )

          cfg = {
              "SUPABASE_URL": need("SUPABASE_URL"),
              "SUPABASE_PUBLISHABLE_KEY": need("SUPABASE_PUBLISHABLE_KEY"),
              "MAP_TILE_URL_TEMPLATE": tiles,
              "MAP_ATTRIBUTION": attribution,
              # Empty on purpose — see the note above.
              "DEV_ACCOUNT_1_LABEL": "",
              "DEV_ACCOUNT_1_EMAIL": "",
              "DEV_ACCOUNT_1_PASSWORD": "",
          }

          out = pathlib.Path(os.environ["CM_BUILD_DIR"]) / "apps/mgk_run/config/app_config.json"
          out.parent.mkdir(parents=True, exist_ok=True)
          out.write_text(json.dumps(cfg, indent=2))
          print(f"wrote {out} ({len(cfg)} keys)")
          PY
      - name: Flutter packages
        script: flutter pub get
      - name: Generate code
        # Drift's generated sources are gitignored, so this is not optional:
        # without it the local database does not compile.
        script: dart run build_runner build --delete-conflicting-outputs
      - name: Install CocoaPods
        script: find . -name "Podfile" -execdir pod install \;
      - name: Set up code signing
        # Applies the profile Codemagic fetched during environment setup. It
        # FETCHES; it does not create. The first build for this bundle id
        # failed here with "No matching profiles found for bundle identifier
        # ... and distribution type app_store", because an App ID is not a
        # provisioning profile and nothing had made one.
        #
        # See setup step 5 above: the profile is created once, by hand, in the
        # Apple Developer portal. After that every build finds it.
        script: xcode-project use-profiles
      - name: Build IPA
        # --dart-define-from-file is load-bearing: AppConfig reads every value
        # from it, so an IPA built without this flag launches and then cannot
        # sign anybody in.
        script: |
          flutter build ipa --release \
            --build-number=$(($PROJECT_BUILD_NUMBER)) \
            --dart-define-from-file=config/app_config.json \
            --export-options-plist=/Users/builder/export_options.plist
    artifacts:
      # **Both, deliberately.** A build that compiles and publishes nothing is
      # the worst outcome available: every step reports success, the log says
      # "No artifacts were found", and TestFlight stays empty. That is what
      # happened on build 3, because these globs resolve relative to
      # `working_directory` and the pattern was written relative to the clone
      # root — with a comment confidently asserting the opposite.
      #
      # Codemagic ignores a pattern that matches nothing, so listing both costs
      # nothing and removes the guess.
      - build/ios/ipa/*.ipa
      - apps/mgk_run/build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        # submit_to_app_store: false   # flip on when ready for a store release

  # ─────────────────────────────────────────────────────────────────────────
  # Lift — see docs/release-2.0.0.md for the release this feeds.
  #
  # ONE-TIME SETUP, beyond what Run already established:
  #
  #  1. **No environment group of its own.** `AppConfig` reads exactly the two
  #     values already in `mgk_fitness_supabase` (setup 3a), so Lift references
  #     that and nothing else — Run's map and dev-account variables have no
  #     equivalent here, and an empty `mgk_fitness_lift_env` would only be a
  #     place for a future secret to land without anyone deciding it should.
  #     The OpenRouter key lives in Supabase secrets and never reaches the
  #     client (ADR-0007).
  #
  #  2. **Nothing to create in App Store Connect.** The record exists — it is
  #     Liftio, id 6759969740, shipping 1.4.0 today. This uploads 2.0.0 to the
  #     same record, which is the entire point of ADR-0001.
  #
  #  3. **An App Store distribution provisioning profile for
  #     `com.mgkcodes.liftio`.** developer.apple.com ▸ Certificates, Identifiers
  #     & Profiles ▸ Profiles ▸ + ▸ Distribution ▸ App Store Connect, pick the
  #     App ID and the existing Apple Distribution certificate. Nothing to
  #     download — Codemagic fetches it through the API key.
  #
  #     Not optional and not inherited: the first build failed here, exactly as
  #     Run's did. Note the failure lands during ENVIRONMENT SETUP, before any
  #     script runs, because `ios_signing` below resolves at that point — so the
  #     build reports no script output at all, which reads like a broken config
  #     rather than a missing prerequisite.
  #
  #     Lift declares no entitlements and needs no capabilities — no Sign in
  #     with Apple, no HealthKit, no push. Camera and photo library are
  #     Info.plist usage strings, not App ID capabilities. So this profile does
  #     not need regenerating unless that changes; a profile is a snapshot of
  #     the App ID's capabilities at the moment it was made.
  #
  # The App Store Connect API key is NOT repeated: `frunt_asc` is issued to the
  # team, not to an app, and the .p8 downloads exactly once.
  # ─────────────────────────────────────────────────────────────────────────
  lift-ios-release:
    name: Lift — iOS TestFlight
    instance_type: mac_mini_m2
    max_build_duration: 45

    cache:
      cache_paths:
        - $HOME/.pub-cache
        - $CM_BUILD_DIR/apps/mgk_lift/ios/Pods
    working_directory: apps/mgk_lift
    integrations:
      # Still here, but now only for `publishing` at the foot of this workflow:
      # the TestFlight upload authenticates with this key. Signing no longer
      # goes through it — see `ios_signing` below.
      app_store_connect: frunt_asc
    environment:
      ios_signing:
        # Manual signing, where Run uses `distribution_type` +
        # `bundle_identifier`. The automatic form asks Codemagic to fetch a
        # matching profile from App Store Connect at build time, and for
        # `com.mgkcodes.liftio` that fetch has never once succeeded — five
        # builds (7d758a2 on 2026-08-18; 6a87ad71 / 6a87afcd / 6a87b020 /
        # 6a885451 on 2026-08-21), every one with `startedAt` null, so no
        # machine ever started and nothing about the build itself was reached.
        #
        # Ruled out, each with evidence rather than assumption: the bundle id
        # (yaml and pbxproj match exactly), the Apple team (all six profiles
        # live in ZTS7SQYSA5, and Run's fetch works from the same key), and
        # profile type (App Store, no provisioned devices).
        #
        # The team does hold TWO distribution certificates, which is worth
        # knowing whatever the cause: a legacy `iPhone Distribution` expiring
        # 2027-03-03 that EAS created and still holds the private key for, and
        # an `Apple Distribution` expiring 2027-06-03 that Frunt and Run's
        # profiles use. Every Liftio profile hung off the EAS one. Re-pointing
        # Lift's profile at the June certificate was the obvious fix and it did
        # NOT work — 6a885451 failed identically — so the fetch failure remains
        # genuinely unexplained. Do not spend another build on a theory.
        #
        # These are reference names in Codemagic ▸ Teams ▸ Code signing
        # identities, NOT files in this repo — setup note 6 above. Uploading
        # the pair once is the price of not depending on that fetch.
        provisioning_profiles:
          - liftio_app_store
        certificates:
          - liftio_distribution
      groups:
        # The only group Lift needs. `AppConfig` reads exactly these two values,
        # so there is no lift-specific group to create — an empty one would be a
        # place for the next secret to go without saying so.
        - mgk_fitness_supabase
      flutter: stable
      xcode: latest
      cocoapods: default
    scripts:
      - name: Generate config/app_config.json from secure vars
        # Same JSON-serialiser approach as Run, and for the same reason: these
        # values are pasted into a web form by a human, and Run's first build
        # died on a trailing carriage return written verbatim into the middle of
        # a JSON string. json.dumps escapes; a heredoc does not.
        script: |
          python3 - <<'PY'
          import json, os, pathlib, sys

          def need(name):
              v = (os.environ.get(name) or "").strip()
              if not v:
                  sys.exit(
                      f"{name} is empty. Set it in the mgk_fitness_supabase "
                      "group, or the IPA ships unable to reach Supabase."
                  )
              return v

          cfg = {
              "SUPABASE_URL": need("SUPABASE_URL"),
              "SUPABASE_PUBLISHABLE_KEY": need("SUPABASE_PUBLISHABLE_KEY"),
          }

          out = pathlib.Path(os.environ["CM_BUILD_DIR"]) / "apps/mgk_lift/config/app_config.json"
          out.parent.mkdir(parents=True, exist_ok=True)
          out.write_text(json.dumps(cfg, indent=2))
          print(f"wrote {out} ({len(cfg)} keys)")
          PY
      - name: Flutter packages
        script: flutter pub get
      - name: Generate code
        # Drift's generated sources are gitignored, so this is not optional:
        # without it the local database does not compile. Lift leans on drift
        # harder than Run does — the whole training log is local-first.
        script: dart run build_runner build --delete-conflicting-outputs
      - name: Install CocoaPods
        script: find . -name "Podfile" -execdir pod install \;
      - name: Set up code signing
        script: xcode-project use-profiles
      - name: Build IPA
        # --dart-define-from-file is load-bearing: AppConfig reads both values
        # from it, so an IPA built without this flag launches and then cannot
        # sign anybody in.
        script: |
          flutter build ipa --release \
            --build-number=$(($PROJECT_BUILD_NUMBER)) \
            --dart-define-from-file=config/app_config.json \
            --export-options-plist=/Users/builder/export_options.plist
    artifacts:
      # Both patterns, as Run learned the hard way: these globs resolve relative
      # to `working_directory`, a pattern that matches nothing is ignored
      # silently, and the failure mode is a green build with an empty TestFlight.
      - build/ios/ipa/*.ipa
      - apps/mgk_lift/build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        # submit_to_app_store: false   # flip on when ready for a store release

  # ─────────────────────────────────────────────────────────────────────────
  # Lift — Android. The suite's first Android release of anything.
  #
  # Runs on Linux, not macOS: nothing here needs Xcode, and the macOS instance
  # costs several times as much per minute. The iOS workflow above is on mac
  # because it has to be, not because the suite standardises on it.
  #
  # ONE-TIME SETUP:
  #
  #  1. **An upload keystore**, created once and backed up somewhere that is not
  #     this repository:
  #
  #       keytool -genkey -v -keystore liftio-upload.jks \
  #         -keyalg RSA -keysize 2048 -validity 10000 -alias upload
  #
  #     Upload it to Codemagic ▸ Team settings ▸ Code signing identities ▸
  #     Android keystores, referenced below as `liftio_upload`. Codemagic then
  #     exports CM_KEYSTORE_PATH / CM_KEYSTORE_PASSWORD / CM_KEY_ALIAS /
  #     CM_KEY_PASSWORD, which `app/build.gradle.kts` reads in preference to a
  #     local `key.properties`. The build REFUSES to fall back to the debug key
  #     on a CI machine, because Play accepts that upload and rejects it after.
  #
  #  2. **A Google Play service account.** Play Console ▸ Setup ▸ API access ▸
  #     link a Google Cloud project, create a service account, grant it Release
  #     manager. Download the JSON and paste it into a secure variable named
  #     GCLOUD_SERVICE_ACCOUNT_CREDENTIALS in the group below.
  #
  #  3. **Upload the first bundle BY HAND.** The Play Developer API cannot
  #     create an app listing — it can only add a release to one that exists —
  #     so the very first `.aab` has to go through the Play Console UI, along
  #     with the store listing, content rating and Data safety form. Every build
  #     after that publishes through this workflow. Set `publishing` aside until
  #     then: with no listing, the upload step fails after a successful build,
  #     which reads like a broken pipeline rather than a missing prerequisite.
  #
  # There is no App Store Connect integration here and no `ios_signing`; an
  # Android build needs neither, and naming them would imply Apple credentials
  # were involved in shipping to Google.
  # ─────────────────────────────────────────────────────────────────────────
  lift-android-release:
    name: Lift — Android internal
    instance_type: linux_x2
    max_build_duration: 45

    cache:
      cache_paths:
        - $HOME/.pub-cache
        # Gradle's cache, which is most of a cold Android build's minutes.
        # Not build/, for the same reason the iOS workflow does not cache it:
        # stale generated output is how a green build ships yesterday's code.
        - $HOME/.gradle/caches
    working_directory: apps/mgk_lift
    environment:
      android_signing:
        - liftio_upload
      groups:
        # The only group Lift needs. `AppConfig` reads exactly these two values,
        # so there is no lift-specific group to create — an empty one would be a
        # place for the next secret to go without saying so.
        - mgk_fitness_supabase
      flutter: stable
    scripts:
      - name: Generate config/app_config.json from secure vars
        # Identical to the iOS workflow's, deliberately: the app reads the same
        # two values whichever store it came from, and a second copy that drifts
        # would mean one platform quietly shipping a different backend.
        script: |
          python3 - <<'PY'
          import json, os, pathlib, sys

          def need(name):
              v = (os.environ.get(name) or "").strip()
              if not v:
                  sys.exit(
                      f"{name} is empty. Set it in the mgk_fitness_supabase "
                      "group, or the bundle ships unable to reach Supabase."
                  )
              return v

          cfg = {
              "SUPABASE_URL": need("SUPABASE_URL"),
              "SUPABASE_PUBLISHABLE_KEY": need("SUPABASE_PUBLISHABLE_KEY"),
          }

          out = pathlib.Path(os.environ["CM_BUILD_DIR"]) / "apps/mgk_lift/config/app_config.json"
          out.parent.mkdir(parents=True, exist_ok=True)
          out.write_text(json.dumps(cfg, indent=2))
          print(f"wrote {out} ({len(cfg)} keys)")
          PY
      - name: Flutter packages
        script: flutter pub get
      - name: Generate code
        script: dart run build_runner build --delete-conflicting-outputs
      - name: Build AAB
        # An app bundle, not an APK: Play has required .aab for new apps since
        # 2021, and this listing does not exist yet, so there is no legacy APK
        # path available even as a fallback.
        #
        # --build-number drives versionCode, which Play requires to increase on
        # every upload and never repeat. Same source as the iOS build number so
        # the two stores cannot disagree about which build is newer.
        script: |
          flutter build appbundle --release \
            --build-number=$(($PROJECT_BUILD_NUMBER)) \
            --dart-define-from-file=config/app_config.json
    artifacts:
      - build/app/outputs/bundle/**/*.aab
      - apps/mgk_lift/build/app/outputs/bundle/**/*.aab
      # The mapping file. Without it Play shows obfuscated stack traces and
      # there is no way to symbolicate a crash after the fact.
      - build/app/outputs/mapping/**/mapping.txt
      - apps/mgk_lift/build/app/outputs/mapping/**/mapping.txt
    # Commented until the listing exists — see setup step 3. Uncommenting before
    # the first manual upload turns a working build into a failing one.
    # publishing:
    #   google_play:
    #     credentials: $GCLOUD_SERVICE_ACCOUNT_CREDENTIALS
    #     track: internal
    #     submit_as_draft: true

  run-android-release:
    name: Run — Android
    # Linux, not macOS: an Android build has no reason to run on a Mac instance
    # and a metered plan charges the difference. This is the cheapest machine
    # Codemagic offers that can build Flutter for Android.
    instance_type: linux_x2
    max_build_duration: 30
    cache:
      cache_paths:
        - $HOME/.pub-cache
        - $HOME/.gradle/caches
    working_directory: apps/mgk_run
    environment:
      groups:
        # The same two groups as iOS, and the split is deliberate: the Supabase
        # values belong to the suite (ADR-0008 — one project for both apps), the
        # map values belong to Run.
        #
        # This comment used to argue against splitting them, on the grounds that
        # one group avoided maintaining the same keys in two places. That was
        # answered rather than ignored: the values are not duplicated, they are
        # each in exactly one group, and Lift references the Supabase one
        # instead of keeping a copy. Attach only the second and the build
        # installs SDKs, sets up signing, and dies half a second into the config
        # step on an empty SUPABASE_URL.
        - mgk_fitness_run_env
        - mgk_fitness_supabase
      flutter: stable
      java: 17
    scripts:
      # Byte-for-byte the same generation step as the iOS workflow. It is
      # duplicated rather than shared because Codemagic has no include
      # mechanism for script bodies; if one changes the other has to.
      - name: Generate config/app_config.json from secure vars
        script: |
          mkdir -p config
          cat > config/app_config.json <<JSON
          {
            "SUPABASE_URL": "$SUPABASE_URL",
            "SUPABASE_PUBLISHABLE_KEY": "$SUPABASE_PUBLISHABLE_KEY",
            "MAP_TILE_URL_TEMPLATE": "$MAP_TILE_URL_TEMPLATE",
            "MAP_ATTRIBUTION": "$MAP_ATTRIBUTION"
          }
          JSON
      - name: Flutter packages
        script: flutter pub get
      - name: Generate code
        script: dart run build_runner build --delete-conflicting-outputs
      - name: Analyze
        script: flutter analyze
      - name: Test
        # Cheap here in a way it is not on a Mac instance, and this suite is the
        # only thing that checks the in-run screen against real phone widths.
        script: flutter test
      - name: Build APK
        # --dart-define-from-file is load-bearing for the same reason it is on
        # iOS: AppConfig reads every value from it, and a build without it
        # launches and then cannot sign anybody in.
        script: |
          flutter build apk --release             --build-number=$(($PROJECT_BUILD_NUMBER))             --dart-define-from-file=config/app_config.json
    artifacts:
      # Both paths, for the same reason the iOS workflow lists both: these globs
      # resolve relative to `working_directory`, and a build that publishes
      # nothing reports success with an empty artifact list.
      - build/app/outputs/flutter-apk/*.apk
      - apps/mgk_run/build/app/outputs/flutter-apk/*.apk
      - build/app/outputs/**/mapping.txt
    # No `publishing:` block. Google Play wants an AAB, a signed one, and a
    # track to publish to — none of which exists yet. Until it does, the APK is
    # an artifact you download, which is exactly what testing on a device needs.
