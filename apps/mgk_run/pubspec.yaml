name: mgk_run
description: "Running: tracking, plans, and the AI coach. Part of the MGKCodes fitness suite."
publish_to: none

# The build number after the + is the real one, read straight from here by both
# release workflows. It was +1 while codemagic.yaml passed --build-number from
# Codemagic's project-wide counter, so this line said 1 while TestFlight held 12
# and 13 — the file was simply wrong, and nothing read it.
#
# Bump this before every submission; the stores refuse a number already used for
# this version. Builds 12 and 13 have been tested, so 14 is next, and the test
# sheet is already written for it.
version: 1.0.0+14

environment:
  sdk: ^3.11.5

# Joins the workspace defined by the root pubspec: one shared lockfile, one
# `flutter pub get` for the whole tree.
resolution: workspace

dependencies:
  flutter:
    sdk: flutter

  # The suite's design system. Everything visual comes from here — this app
  # declares no colours, no motion curves, and no fonts of its own.
  mgk_ui:
    path: ../../packages/mgk_ui

  # Measurement types, shared so both apps agree what "imperial" means.
  # Pure Dart: storage is canonical metric, conversion happens at display.
  mgk_units:
    path: ../../packages/mgk_units

  cupertino_icons: ^1.0.8
  drift: ^2.34.2
  sqlite3_flutter_libs: ^0.6.0+eol
  path_provider: ^2.1.6
  path: ^1.9.1
  supabase_flutter: ^2.16.0
  geolocator: ^14.0.3
  flutter_map: ^8.3.1
  latlong2: ^0.10.1
  health: 13.2.0
  purchases_flutter: ^10.10.1
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift_dev: ^2.34.0
  build_runner: ^2.15.1

flutter:
  uses-material-design: true

  assets:
    - assets/images/backgrounds/

  # No `fonts:` block, deliberately. Inter is declared by mgk_ui, so the family
  # is addressed as `packages/mgk_ui/Inter` and reaches this app through
  # AppTheme.fontFamily. Re-declaring it here as plain `Inter` would shadow that
  # with a second family and silently fall back to the platform default — a bug
  # only catchable by eye.
