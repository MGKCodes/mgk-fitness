name: mgk_lift
description: "Lifting: workouts, progress photos, and the AI coach. Part of the MGKCodes fitness suite."
publish_to: none

# Liftio's App Store build is at 1.4.0, and this replaces it rather than
# launching beside it — same listing, same bundle id, so the version has to
# exceed what is shipped. A rewrite that changes language, storage and business
# model is what a major bump is for.
#
# It sat at 0.1.0 until it could make that claim. See
# [docs/decisions/0001-liftio-is-replaced-not-relaunched.md].
#
# Build numbers must strictly increase within the 2.0.0 train; App Store Connect
# rejects a re-used one.
version: 2.0.0+1

environment:
  sdk: ^3.11.5

# Joins the workspace defined by the root pubspec.
resolution: workspace

dependencies:
  flutter:
    sdk: flutter

  # The suite's design system. Everything visual comes from here — this app
  # declares no colours, no motion curves, and no fonts of its own.
  mgk_ui:
    path: ../../packages/mgk_ui

  # Measurement types, shared so both apps agree what "imperial" means.
  # Pure Dart: storage is canonical metric, conversion happens at display.
  mgk_units:
    path: ../../packages/mgk_units

  cupertino_icons: ^1.0.8
  supabase_flutter: ^2.16.0

  # Already in the lockfile under supabase_flutter. Declared so backup can name
  # `ClientException` — the dropped connection — and tell it apart from a
  # server that refused a workout, which is handled the opposite way.
  http: ^1.6.0

  # Explicit rather than leaning on Flutter's re-export, so `lib/src/features/
  # */domain/` stays pure Dart — no widget binding needed to test the rules.
  meta: ^1.17.0

  # The on-device database. Offline-first is not a nice-to-have here: a set is
  # logged standing at a rack, and a gym basement with no signal is the normal
  # case rather than the edge case.
  drift: ^2.34.2
  sqlite3_flutter_libs: ^0.6.0+eol
  path_provider: ^2.1.6
  path: ^1.9.1
  image_picker: ^1.2.3

  # Display preferences that must survive a launch without needing an account.
  # Already in the lockfile via supabase_flutter, which uses it to persist the
  # session, so declaring it directly adds nothing to the bundle — it stops the
  # app depending on a transitive it never asked for.
  #
  # Deliberately NOT drift. The training log is relational and belongs in a
  # database; "which unit do you read weights in" is one key, needs no migration
  # when it changes, and must be readable before the database has opened.
  shared_preferences: ^2.5.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift_dev: ^2.34.0
  build_runner: ^2.15.1

flutter:
  uses-material-design: true

  # Gym photography, greyscale. The PhotoBackdrop treatment is shared by the
  # suite (mgk_ui), but the images belong to the app — Run shows running, Lift
  # shows lifting, and the treatment over them stays identical.
  assets:
    - assets/images/backgrounds/
    # 266 movements, start/end form frames. Ported from Liftio rather than
    # rebuilt \u2014 recreating this library would be months of work for a worse one.
    - assets/exercises/
    - assets/images/splits/

  # No `fonts:` block, deliberately. Inter is declared by mgk_ui, so the family
  # is addressed as `packages/mgk_ui/Inter` and reaches this app through
  # AppTheme.fontFamily. Re-declaring it here as plain `Inter` would shadow that
  # and silently fall back to the platform default.
