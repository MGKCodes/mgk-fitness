name: mgk_fitness
description: "Workspace root for the MGKCodes fitness suite. Not a shippable package."
publish_to: none

# Native pub workspaces (Dart >=3.6) rather than Melos: one shared lockfile and
# one `flutter pub get` for the whole tree. Glob members need Dart >=3.11, which
# is what lets apps/ and packages/ be listed once instead of per package.
environment:
  sdk: ^3.11.0

# Every package under these paths joins the workspace automatically, provided it
# declares `resolution: workspace` in its own pubspec.
#
# `apps/**` was held back while apps/ was empty: pub treats a glob that matches
# no package as an error, not as an empty set, so listing it would have broken
# `flutter pub get` for the whole tree. mgk_run landed on 2026-08-06, so it is
# live now. If apps/ ever empties again, comment this out rather than wondering
# why the workspace stopped resolving.
# Single `*`, not `**`. Both directories are exactly one level deep, so `*`
# says what is true — and `**` breaks `dart test` run from inside a member
# package, where pub evaluates the glob against the current directory rather
# than the workspace root and reports "No workspace packages matching apps/**".
workspace:
  - packages/*
  - apps/*

# **A version clash between two mobile plugins, resolved at the package that
# has versions on both sides.**
#
# `health` reaches win32 ^5 through device_info_plus; `geolocator` reaches
# win32 ^6 through geolocator_linux -> package_info_plus. Without an override
# there is no `health` newer than 3.0.6 — a 2021 release — that resolves
# alongside geolocator at all.
#
# The first attempt forced `win32: ^6.0.0` on the reasoning that neither Linux
# nor Windows is a target platform (ADR-0001 is iOS-first). That was wrong, and
# wrong in a way worth recording: `flutter test` compiles for the HOST, so
# device_info_plus's Windows implementation is built on this machine and failed
# against win32 6. A desktop dependency being irrelevant to the shipped app
# does not make it irrelevant to the build.
#
# device_info_plus 13 moved to win32 ^6, which is the version both sides can
# agree on. Overriding it lifts the floor rather than forcing a package to
# compile against an API it was not written for.
dependency_overrides:
  device_info_plus: ^13.0.0
